<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; media-src study-media:; img-src 'self' data:"
    />
    <title>本地视频</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b1120;
        color: #e2e8f0;
        font:
          13px/1.6 'Inter',
          'Segoe UI',
          'Microsoft YaHei UI',
          system-ui,
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      video {
        width: 100%;
        flex: 1;
        min-height: 0;
        background: #020617;
      }
      p {
        margin: 0;
        padding: 10px 18px;
        background: rgba(15, 23, 42, 0.92);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        color: #94a3b8;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <video controls crossorigin="anonymous" preload="metadata"></video>
    <p id="status">使用内置播放器播放；若编码不受支持，请换用 MP4（H.264）或 WebM。</p>
    <script type="module" src="/player.ts"></script>
  </body>
</html>
