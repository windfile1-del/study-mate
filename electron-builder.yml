appId: local.studymate.desktop
productName: Study Mate
asar: true
asarUnpack:
  - node_modules/sherpa-onnx-win-x64/**/*
electronDist: node_modules/electron/dist
afterPack: scripts/package-local-models.cjs
directories:
  output: release/0.14.0
files:
  - out/**/*
  - package.json
extraResources:
  - from: docs/17-逐篇恢复与紧凑伴学界面.md
    to: 逐篇恢复与紧凑界面说明.md
  - from: docs/16-会话与学习资料管理.md
    to: 会话与学习资料管理说明.md
  - from: docs/15-灵活工作台与批注.md
    to: 工作台与批注说明.md
  - from: docs/14-视频自主阅读与缓存.md
    to: 视频阅读与缓存说明.md
  - from: vendor/recognition
    to: notices/recognition
    filter: ['**/*', '!audio-worklet.js']
  - from: docs/13-中文采音与多模态检索.md
    to: 中文采音与多模态检索说明.md
  - from: vendor/documents
    to: notices/documents
  - from: docs/12-PDF与PowerPoint阅读.md
    to: 文档阅读说明.md
  - from: vendor/subscriptions/NOTICE.md
    to: notices/subscriptions.md
  - from: vendor/video-observer/NOTICE.md
    to: notices/video-observer.md
  - from: docs/随包说明.txt
    to: 随包说明.txt
win:
  target:
    - target: zip
      arch: [x64]
  signAndEditExecutable: false
artifactName: Study-Mate-${version}-Windows-${arch}.${ext}
